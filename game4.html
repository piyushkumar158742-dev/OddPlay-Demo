<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060d">
<title>A is Z Typer — Cosmic Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #05060d;
    --text-untyped: #cdd3ee;
    --color-correct: #00f5c4;
    --color-literal: #ffbe3d;
    --color-wrong: #ff3d6e;
    --panel-border: rgba(0, 245, 196, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; width: 100%; overscroll-behavior: none; overflow: hidden; }
  html { background: var(--bg-1); overflow: hidden; width: 100%; }

  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,245,196,0.08), transparent 60%),
      radial-gradient(ellipse 70% 55% at 100% 100%, rgba(124,108,240,0.10), transparent 60%),
      var(--bg-1);
    color: var(--text-untyped);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    position: relative;
    user-select: none;
  }

  @keyframes screenShake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }
  body.screen-shake .topbar,
  body.screen-shake .hud,
  body.screen-shake .stage-wrap,
  body.screen-shake .keyboard-dock {
    animation: screenShake 0.4s;
  }

  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.35;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
  }

  /* ============ Top bar (title + settings) ============ */
  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.4rem;
    z-index: 20; position: relative;
  }
  .game-title {
    font-size: clamp(0.85rem, 2.4vw, 1.05rem);
    font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
    color: #ffffff;
  }
  .settings-btn {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--panel-border); color: var(--text-untyped);
    cursor: pointer; transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .settings-btn:hover { background: rgba(0,245,196,0.1); color: var(--color-correct); border-color: var(--color-correct); }
  .settings-btn svg { width: 16px; height: 16px; }

  .settings-panel {
    position: fixed; top: 4.2rem; right: 1.4rem;
    width: min(240px, 80vw);
    background: rgba(8, 10, 20, 0.97);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border); border-radius: 14px;
    padding: 14px; z-index: 40;
    opacity: 0; pointer-events: none; transform: translateY(-8px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .settings-panel.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .settings-panel h2 {
    font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(205,211,238,0.5); margin-bottom: 10px; font-weight: 700;
  }
  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .settings-row span { font-size: 0.82rem; color: var(--text-untyped); }
  .settings-toggle {
    width: 36px; height: 20px; border-radius: 20px;
    background: rgba(255,255,255,0.1); border: 1px solid var(--panel-border);
    position: relative; cursor: pointer; transition: background .2s ease; flex-shrink: 0;
  }
  .settings-toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--text-untyped); transition: transform .2s ease, background .2s ease;
  }
  .settings-toggle.on { background: rgba(0,245,196,0.25); border-color: var(--color-correct); }
  .settings-toggle.on::after { transform: translateX(16px); background: var(--color-correct); }

  /* ============ HUD ============ */
  .hud {
    flex: 0 0 auto;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 0 1.4rem;
    z-index: 2;
  }
  .hud-block { display: flex; flex-direction: column; gap: 2px; }
  .hud-label {
    font-size: 0.62rem; letter-spacing: 3px; text-transform: uppercase;
    color: rgba(205, 211, 238, 0.45); font-weight: 500;
  }
  .hud-value {
    font-size: clamp(1.1rem, 3.4vw, 1.4rem); font-weight: 700; color: #ffffff;
    font-variant-numeric: tabular-nums;
  }
  .typo-count {
    font-size: 0.65rem; font-weight: 500; letter-spacing: 1px;
    color: var(--color-wrong); opacity: 0.75;
    font-variant-numeric: tabular-nums;
  }
  #time { color: var(--color-correct); }

  /* ============ Main stage ============ */
  .main-stage {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0.5rem 3vw;
    padding-bottom: var(--kb-dock-height, 210px);
    z-index: 2;
  }

  .stage-wrap {
    display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 3vh, 22px);
    z-index: 2; width: 100%; max-width: 900px;
    transition: opacity 0.5s ease;
  }
  .stage-wrap.fade-out { opacity: 0; }

  .word-card {
    position: relative;
    padding: clamp(1.2rem, 4vh, 2.6rem) clamp(1rem, 6vw, 3.5rem);
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--panel-border);
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .word-display {
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    gap: 0.3em;
    text-transform: uppercase;
    max-width: 100%;
  }

  .word-group { display: inline-flex; gap: 4px; white-space: nowrap; }

  .letter { position: relative; transition: color 0.1s ease; }
  .letter.space-letter { width: 0.4em; }

  .letter.current::after {
    content: '';
    position: absolute; left: 4%; right: 4%; bottom: -0.14em;
    height: 3px; border-radius: 3px;
    background: currentColor;
    animation: caretBlink 1s steps(2) infinite;
  }
  @keyframes caretBlink { 50% { opacity: 0.15; } }

  .untyped { color: var(--text-untyped); opacity: 0.88; }
  .typed { color: var(--color-correct); }
  .literal-error { color: var(--color-literal); }
  .wrong-error { color: var(--color-wrong); animation: shake 0.22s ease; }
  @keyframes shake {
    0%, 100% { transform: translateY(0); }
    30% { transform: translateY(-3px); }
    60% { transform: translateY(2px); }
  }

  @keyframes popIn {
    0% { transform: scale(0.9); opacity: 0; }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); opacity: 1; }
  }
  .pop-anim { animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

  /* ============ On-screen keyboard ============ */
  .keyboard-dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 10px max(12px, env(safe-area-inset-left)) calc(max(10px, env(safe-area-inset-bottom)) + 64px);
    background: linear-gradient(to top, rgba(5,6,13,0.98) 55%, transparent);
    z-index: 25;
  }

  .hint {
    font-size: 0.66rem; letter-spacing: 1px; color: rgba(205, 211, 238, 0.35);
    text-align: center; max-width: 90vw;
  }
  .hint strong { color: rgba(205, 211, 238, 0.6); }

  .keyboard {
    display: flex; flex-direction: column; gap: var(--kb-gap, 6px);
    width: 100%; max-width: 640px; align-items: center;
  }
  .kb-row { display: flex; gap: var(--kb-gap, 6px); justify-content: center; width: 100%; }
  .kb-key {
    width: var(--kb-key, 34px);
    height: var(--kb-key, 34px);
    flex: 0 0 auto;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.03);
    color: var(--text-untyped);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: calc(var(--kb-key, 34px) * 0.42);
    cursor: pointer;
    touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
    transition: background .1s ease, color .1s ease, border-color .1s ease, transform .08s ease;
  }
  .kb-key:hover { background: rgba(0,245,196,0.08); border-color: rgba(0,245,196,0.35); color: #fff; }
  .kb-key:active, .kb-key.pressed {
    background: rgba(0,245,196,0.22); border-color: var(--color-correct);
    color: var(--color-correct); transform: scale(0.92);
  }
  .external-kb-note {
    font-size: 0.62rem; letter-spacing: 1.5px; text-transform: uppercase;
    color: rgba(0, 245, 196, 0.55); text-align: center;
  }

  /* ============ Bottom game nav (shared arcade chrome) ============ */
  .game-nav {
    position: fixed; left: 50%; bottom: 16px;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px;
    background: rgba(8, 10, 20, 0.97);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border); padding: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5); z-index: 30;
    border-radius: 50px;
  }
  .game-nav-btn {
    background: transparent; border: none; color: var(--text-untyped);
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .2s ease, color .2s ease;
  }
  .game-nav-btn svg { width: 16px; height: 16px; }
  .game-nav-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .game-nav-btn.random-btn { color: var(--color-literal); }
  .game-nav-btn.random-btn:hover { background: rgba(255,190,61,0.14); }

  @media (min-width: 992px) {
    .game-nav {
      opacity: 0; transform: translate(-50%, 150%);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      pointer-events: none;
    }
    .game-nav.desktop-visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  }

  @media (max-width: 991px) {
    .kb-key {
      height: calc(var(--kb-key, 34px) * 1.55);
      border-radius: 6px;
      font-size: calc(var(--kb-key, 34px) * 0.55);
      background: rgba(255, 255, 255, 0.06);
    }

    .keyboard-dock {
      padding-left: max(6px, env(safe-area-inset-left));
      padding-right: max(6px, env(safe-area-inset-right));
    }

    .game-nav {
      left: auto; right: 16px; transform: none;
      bottom: 16px;
      width: 50px; height: 50px; padding: 0;
      background: transparent; border: none; box-shadow: none;
      backdrop-filter: none; -webkit-backdrop-filter: none;
      cursor: pointer;
    }
    .game-nav::before {
      content: ''; position: absolute; inset: 0; border-radius: 14px;
      background: rgba(8, 10, 20, 0.97);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' stroke='%2300f5c4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='3' y='3' width='18' height='18' rx='4'%3E%3C/rect%3E%3Ccircle cx='8' cy='8' r='1.3' fill='%2300f5c4' stroke='none'%3E%3C/circle%3E%3Ccircle cx='16' cy='8' r='1.3' fill='%2300f5c4' stroke='none'%3E%3C/circle%3E%3Ccircle cx='12' cy='12' r='1.3' fill='%2300f5c4' stroke='none'%3E%3C/circle%3E%3Ccircle cx='8' cy='16' r='1.3' fill='%2300f5c4' stroke='none'%3E%3C/circle%3E%3Ccircle cx='16' cy='16' r='1.3' fill='%2300f5c4' stroke='none'%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: center; background-size: 20px 20px;
      transition: opacity 0.25s ease;
    }
    .game-nav.mobile-expanded::before { opacity: 0; }
    .game-nav-btn {
      position: absolute; right: 0; bottom: 56px;
      width: 46px; height: 46px; border-radius: 14px;
      background: rgba(8, 10, 20, 0.97);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      opacity: 0; transform: translateY(14px) scale(0.85); pointer-events: none;
      transition: opacity 0.25s ease, transform 0.32s cubic-bezier(0.2,0.8,0.2,1);
    }
    .game-nav-btn:nth-child(1) { bottom: 56px; transition-delay: 0s; }
    .game-nav-btn:nth-child(2) { bottom: 112px; transition-delay: 0.04s; }
    .game-nav-btn:nth-child(3) { bottom: 168px; transition-delay: 0.08s; }
    .game-nav.mobile-expanded .game-nav-btn { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

  }

  @media (max-height: 620px) {
    .hint, .external-kb-note { display: none; }
  }
</style>
</head>

  `;

  const words = [...new Set(rawWords.split(/\s+/).filter(Boolean))];

  // ===========================================================
  // Game state
  // ===========================================================
  const SPECIAL_THANKS = 'thank you for playing';
  const SPECIAL_AGAIN = 'play again';
  const TYPO_PENALTY = 2;

  let currentWord = '';
  let currentIndex = 0;
  let score = 0;
  let typoCount = 0;
  let totalTimeSpent = 0;
  let isTransitioning = false;
  let spanElements = [];
  let currentWordIsSpecial = false;

  let gameWords = [];
  let wordPointer = 0;
  let stage = 'playing'; // 'playing' | 'thanks' | 'again'

  let wordStartTime = 0;
  let timerRaf = null;

  const wordDisplayElement = document.getElementById('word-display');
  const wordCardEl = wordDisplayElement.parentElement;
  const stageWrapEl = document.getElementById('stage-wrap');
  const scoreElement = document.getElementById('score');
  const typoElement = document.getElementById('typo-count');
  const timeElement = document.getElementById('time');
  const keyboardEl = document.getElementById('keyboard');
  const keyboardDockEl = document.getElementById('keyboard-dock');

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function registerTypo() {
    typoCount++;
    typoElement.innerText = typoCount + (typoCount === 1 ? ' typo' : ' typos');
    score = Math.max(0, score - TYPO_PENALTY);
    scoreElement.innerText = score;
  }

  function resetGame() {
    gameWords = shuffle(words);
    wordPointer = 0;
    stage = 'playing';
    score = 0;
    typoCount = 0;
    totalTimeSpent = 0;
    scoreElement.innerText = score;
    typoElement.innerText = '0 typos';
  }

  function getNextWord() {
    if (stage === 'playing') {
      if (wordPointer < gameWords.length) {
        currentWordIsSpecial = false;
        return gameWords[wordPointer++];
      }
      stage = 'thanks';
      currentWordIsSpecial = true;
      return SPECIAL_THANKS;
    }
    // stage === 'thanks'
    stage = 'again';
    currentWordIsSpecial = true;
    return SPECIAL_AGAIN;
  }

  function updateActiveLetter() {
    spanElements.forEach(s => s.classList.remove('current'));
    if (currentIndex < spanElements.length) {
      spanElements[currentIndex].classList.add('current');
    }
  }

  function stopTimer() {
    if (timerRaf) cancelAnimationFrame(timerRaf);
    timerRaf = null;
  }

  function startTimer() {
    wordStartTime = performance.now();
    timeElement.innerText = '0.00s';
    stopTimer();
    timerRaf = requestAnimationFrame(updateTimer);
  }

  function updateTimer() {
    const elapsed = (performance.now() - wordStartTime) / 1000;
    timeElement.innerText = elapsed.toFixed(2) + 's';
    timerRaf = requestAnimationFrame(updateTimer);
  }

  function triggerScreenShake() {
    document.body.classList.remove('screen-shake');
    void document.body.offsetWidth;
    document.body.classList.add('screen-shake');
  }

  function completeWord() {
    isTransitioning = true;
    const finalElapsed = (performance.now() - wordStartTime) / 1000;
    stopTimer();
    timeElement.innerText = finalElapsed.toFixed(2) + 's';
    if (!currentWordIsSpecial) {
      score += 10;
      scoreElement.innerText = score;
      totalTimeSpent += finalElapsed;
    }

    if (currentWord === SPECIAL_AGAIN) {
      stageWrapEl.classList.add('fade-out');
      setTimeout(() => {
        resetGame();
        startNextWord();
        stageWrapEl.classList.remove('fade-out');
      }, 500);
      return;
    }

    setTimeout(startNextWord, 600);
  }

  function autoAdvanceSpaces() {
    while (currentIndex < currentWord.length && currentWord[currentIndex] === ' ') {
      spanElements[currentIndex].classList.add('typed', 'space-letter');
      currentIndex++;
    }
    if (currentIndex === currentWord.length) {
      completeWord();
    } else {
      updateActiveLetter();
    }
  }

  function fitWordSize() {
    const cardStyles = getComputedStyle(wordCardEl);
    const paddingX = parseFloat(cardStyles.paddingLeft) + parseFloat(cardStyles.paddingRight);
    const availableWidth = Math.max(wordCardEl.clientWidth - paddingX, 100);
    const segments = currentWord.split(' ').filter(Boolean);
    const longest = segments.reduce((m, s) => Math.max(m, s.length), 1);
    const CHAR_RATIO = 0.66;
    let fontSize = availableWidth / (longest * CHAR_RATIO);
    const viewportCap = window.innerWidth < 640 ? 56 : 92;
    fontSize = Math.max(24, Math.min(fontSize, viewportCap));
    wordDisplayElement.style.fontSize = fontSize + 'px';
  }

  // Row 1 has 10 keys — that sets the true key size. Rows 2 and 3
  // use the same size and are simply centered, which naturally
  // reproduces the half-key/1.5-key stagger of a real keyboard.
  // Mobile gets a tighter gap and a much higher minimum/maximum so
  // keys are genuinely easy to tap, not just tall.
  function fitKeyboardSize() {
    const isMobile = window.innerWidth < 640;
    const gap = isMobile ? 4 : 6;
    document.documentElement.style.setProperty('--kb-gap', gap + 'px');

    const available = keyboardEl.clientWidth;
    if (!available) return;
    let keySize = (available - 9 * gap) / 10;
    const minSize = isMobile ? 36 : 28;
    const maxSize = isMobile ? 58 : 48;
    keySize = Math.max(minSize, Math.min(keySize, maxSize));
    document.documentElement.style.setProperty('--kb-key', keySize + 'px');
  }

  function fitKeyboardDock() {
    fitKeyboardSize();
    requestAnimationFrame(() => {
      document.documentElement.style.setProperty('--kb-dock-height', keyboardDockEl.offsetHeight + 'px');
      fitWordSize();
    });
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitKeyboardDock, 120);
  });

  function startNextWord() {
    currentWord = getNextWord();
    currentIndex = 0;
    isTransitioning = false;
    spanElements = [];

    wordDisplayElement.innerHTML = '';

    let wordGroup = null;
    for (let i = 0; i < currentWord.length; i++) {
      const ch = currentWord[i];
      if (ch === ' ') {
        const span = document.createElement('span');
        span.innerText = '\u00A0';
        span.className = 'letter untyped space-letter';
        wordDisplayElement.appendChild(span);
        spanElements.push(span);
        wordGroup = null;
      } else {
        if (!wordGroup) {
          wordGroup = document.createElement('span');
          wordGroup.className = 'word-group';
          wordDisplayElement.appendChild(wordGroup);
        }
        const span = document.createElement('span');
        span.innerText = ch;
        span.className = 'letter untyped';
        wordGroup.appendChild(span);
        spanElements.push(span);
      }
    }

    fitWordSize();
    startTimer();

    wordDisplayElement.classList.remove('pop-anim');
    void wordDisplayElement.offsetWidth;
    wordDisplayElement.classList.add('pop-anim');

    autoAdvanceSpaces();
  }

  function getReversedChar(char) {
    const code = char.charCodeAt(0);
    if (code >= 97 && code <= 122) {
      return String.fromCharCode(219 - code);
    }
    return char;
  }

  function flashKey(letter) {
    const btn = keyboardEl.querySelector('.kb-key[data-key="' + letter + '"]');
    if (!btn) return;
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 120);
  }

  // Shared by physical keydown, the invisible mobile-keyboard input,
  // AND on-screen keyboard taps — every input method drives the exact
  // same game logic through this one function.
  function processKey(pressedKey) {
    if (isTransitioning) return;
    if (!/^[a-z]$/.test(pressedKey)) return;

    const targetChar = currentWord[currentIndex];
    const reversedKey = getReversedChar(pressedKey);
    const currentSpan = spanElements[currentIndex];
    if (!currentSpan) return;

    flashKey(pressedKey);

    if (reversedKey === targetChar) {
      currentSpan.classList.remove('untyped', 'literal-error', 'wrong-error');
      currentSpan.classList.add('typed');
      currentIndex++;
      autoAdvanceSpaces();
    } else if (pressedKey === targetChar) {
      currentSpan.classList.remove('untyped', 'wrong-error', 'typed');
      currentSpan.classList.add('literal-error');
      updateActiveLetter();
      registerTypo();
    } else {
      currentSpan.classList.remove('untyped', 'literal-error', 'typed');
      currentSpan.classList.add('wrong-error');
      updateActiveLetter();
      triggerScreenShake();
      registerTypo();
    }
  }

  // ---- Physical keyboard ----
  document.addEventListener('keydown', (e) => {
    if (e.key === '8') {
      stopTimer();
      stage = 'thanks';
      startNextWord();
      return;
    }

    if (e.key === 'Backspace' || e.key === ' ') {
      e.preventDefault();
    }

    if (isTransitioning || e.ctrlKey || e.altKey || e.metaKey || e.key.length !== 1) {
      return;
    }

    processKey(e.key.toLowerCase());
  });

  // ---- On-screen keyboard (mouse or touch tap) ----
  keyboardEl.querySelectorAll('.kb-key').forEach(btn => {
    btn.addEventListener('click', () => processKey(btn.dataset.key));
  });

  // Shared arcade controls are provided by shared.js?v=20260920.

  window.onload = () => {
    fitKeyboardDock();
    resetGame();
    startNextWord();
  };
</script>
