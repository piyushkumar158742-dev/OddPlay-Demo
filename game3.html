<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060f">
<title>Stop at 5.000 — Cosmic Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  header { position: relative; z-index: 2; }

  .timer-title {
    font-family: 'Roboto', sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    font-size: clamp(1.2rem, 5vw, 2rem);
    letter-spacing: 4px;
    color: #eafcff;
  }

  .timer-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px;
    position: relative;
    z-index: 2;
  }

  .timer-display {
    font-family: 'Roboto', sans-serif;
    font-weight: 700;
    font-size: clamp(2.8rem, 14vw, 5.8rem);
    color: #eafcff;
    transition: opacity .6s ease, color .3s ease;
    font-variant-numeric: tabular-nums;
  }

  .timer-panel.danger .timer-display { color: #ff5470; }
  .timer-panel.hidden-phase .timer-display { opacity: 0; }

  .timer-btn {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 0.85rem;
    padding: 14px 40px;
    border-radius: 6px;
    margin-top: 28px;
    border: 1px solid rgba(45,212,255,0.5);
    background: rgba(45,212,255,0.08);
    color: #2dd4ff;
    cursor: pointer;
    transition: background .25s ease, color .25s ease, transform .15s ease, border-color .25s ease;
  }
  .timer-btn:hover { background: rgba(45,212,255,0.16); transform: translateY(-2px); }
  .timer-btn:active { transform: translateY(0) scale(0.97); }
  .timer-btn.stop { border-color: rgba(255,45,120,0.6); background: rgba(255,45,120,0.1); color: #ff5470; }
  .timer-btn.stop:hover { 
  background: #ff5470; 
  color: #ffffff; 
  border-color: #ff5470; 
  }
  .timer-btn:focus-visible { outline: 2px solid #2dd4ff; outline-offset: 3px; }

  .timer-result {
    font-family: 'Space Mono', monospace;
    font-size: clamp(0.8rem, 2.2vw, 0.95rem);
    letter-spacing: 1px;
    text-transform: uppercase;
    min-height: 1.4em;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .35s ease, transform .35s ease;
    text-align: center;
  }
  .timer-result.visible { opacity: 1; transform: translateY(0); }
  .timer-result.fail { color: #ff5470; }
  .timer-result.miss { color: #2dd4ff; }
  .timer-result.perfect { color: #7dffb2; font-weight: 700; }

  /* Redesigned Official X Button */
  .share-btn {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 0.8rem;
    padding: 12px 28px;
    border-radius: 9999px;
    margin-top: 10px;
    border: 1px solid #333;
    background: #000000;
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity .35s ease, transform .35s ease, background .2s ease;
  }
  .share-btn.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .share-btn:hover { background: #1a1a1a; }
  .share-btn svg { width: 14px; height: 14px; fill: #ffffff; }
</style>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body data-game-index="2">
  <!-- Shared arcade controls are generated by shared.js. -->
  <div class="bg-void"></div>
  <div class="bg-grid"></div>
  <div class="bg-orbit-wrap"><svg id="orbit-svg" viewBox="0 0 700 700"></svg></div>
  <canvas id="starfield" aria-hidden="true"></canvas>
</div>

  <header>
    <h1 class="timer-title">Stop at 5.000</h1>
  </header>

  <div class="app-container">
    <div class="timer-panel" id="timer-panel">
      <div class="timer-display" id="timer-display">0.000</div>
      <button class="timer-btn" id="timer-btn" type="button">Start</button>
      <div class="timer-result" id="timer-result" aria-live="polite"></div>

      <button class="share-btn" id="share-btn" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 22.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        Share on 𝕏
      </button>
    </div>
  </div>

  

<script src="shared.js?v=20260920e"></script>
<script>
(function(){
  var display = document.getElementById('timer-display');
  var btn = document.getElementById('timer-btn');
  var result = document.getElementById('timer-result');
  var panel = document.getElementById('timer-panel');
  var shareBtn = document.getElementById('share-btn');
  
  var TARGET = 5.000;
  var TIMEOUT = 10.000;
  var HIDE_AFTER = 2.000;
  var DANGER_AFTER = 8.000;
  var running = false;
  var startTime = 0;
  var rafId = null;
  var shareText = '';

  function tick(){
    if(!running) return;
    var elapsed = (performance.now() - startTime) / 1000;
    if(elapsed >= TIMEOUT){
      finish(TIMEOUT, true);
      return;
    }
    display.textContent = elapsed.toFixed(3);
    panel.classList.toggle('hidden-phase', elapsed >= HIDE_AFTER);
    panel.classList.toggle('danger', elapsed >= DANGER_AFTER);
    rafId = requestAnimationFrame(tick);
  }

  function start(){
    running = true;
    startTime = performance.now();
    display.textContent = '0.000';
    panel.classList.remove('hidden-phase', 'danger');
    btn.textContent = 'Stop';
    btn.classList.add('stop');
    panel.classList.add('running');
    result.classList.remove('visible', 'fail', 'miss', 'perfect');
    result.textContent = '';
    shareBtn.classList.remove('visible');
    rafId = requestAnimationFrame(tick);
  }

  function finish(elapsedRaw, timedOut){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);

    panel.classList.remove('running', 'hidden-phase', 'danger');
    btn.textContent = 'Try Again';
    btn.classList.remove('stop');

    var pageUrl = window.location.href;

    if(timedOut){
      display.textContent = TIMEOUT.toFixed(3);
      result.textContent = "How Slow You Are";
      result.classList.add('visible', 'fail');
      var diffSec = (TIMEOUT - TARGET).toFixed(3);
      shareText = "I was just " + diffSec + " seconds away from stopping the timer at exactly 5.000. You should also try " + pageUrl;
      shareBtn.classList.add('visible');
      return;
    }

    var diffMs = Math.round((elapsedRaw - TARGET) * 1000);
    var clamped = Math.min(Math.max(elapsedRaw, 0), TIMEOUT);
    display.textContent = clamped.toFixed(3);

    if (diffMs === 0) {
      display.textContent = TARGET.toFixed(3);
      result.textContent = "PERFECT — Exactly 5.000";
      result.classList.add('visible', 'perfect');
      shareText = "I stopped the timer at exactly 5.000 seconds. PERFECT. You should also try " + pageUrl;
      shareBtn.classList.add('visible');
      return;
    }

    var diffSeconds = (Math.abs(diffMs) / 1000).toFixed(3);

    if (diffMs > 0) {
      result.textContent = diffSeconds + " seconds away - So Close";
    } else {
      result.textContent = diffSeconds + " seconds away - SO Early";
    }

    result.classList.add('visible', 'miss');
    shareText = "I was just " + diffSeconds + " seconds away from stopping the timer at exactly 5.000. You should also try " + pageUrl;
    shareBtn.classList.add('visible');
  }

  function toggle(){
    if(running){
      var elapsed = (performance.now() - startTime) / 1000;
      finish(elapsed, false);
    } else {
      start();
    }
  }

  btn.addEventListener('click', toggle);

  shareBtn.addEventListener('click', function(){
    var intentUrl = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText);
    window.open(intentUrl, '_blank');
  });

  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar'){
      if(e.repeat) return;
      e.preventDefault();
      toggle();
    }
  });
})();
</script>
</body>
</html>
