<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>DVD Game — Cosmic Arcade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; background: #000; }

  body {
    color: #eaeaea;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    position: relative;
    user-select: none;
  }

  /* ============ Full-bleed stage ============ */
  .dvd-stage {
    position: fixed; inset: 0;
    overflow: hidden;
    background: #000;
    z-index: 1;
  }

  .dvd-logo {
    position: absolute; top: 0; left: 0;
    width: clamp(88px, 16vw, 150px);
    color: #00f5c4;
    filter: drop-shadow(0 0 10px currentColor);
    will-change: transform;
    pointer-events: none;
  }
  .dvd-logo svg { display: block; width: 100%; height: auto; }

  .corner-flash {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
  }
  .corner-flash-text {
    font-family: 'Arial Black', sans-serif; font-style: italic; font-weight: 900;
    font-size: clamp(1.8rem, 8vw, 4.5rem); color: #fff;
    text-shadow: 0 0 40px #ffd23f;
    opacity: 0; transform: scale(0.5);
  }
  .corner-flash.flash-anim .corner-flash-text {
    animation: cornerPop 0.9s cubic-bezier(0.2,0.8,0.2,1);
  }
  @keyframes cornerPop {
    0% { opacity: 0; transform: scale(0.4); }
    25% { opacity: 1; transform: scale(1.15); }
    45% { transform: scale(1); }
    100% { opacity: 0; transform: scale(1.3); }
  }
  .corner-flash.flash-anim {
    animation: cornerBgFlash 0.5s ease-out;
  }
  @keyframes cornerBgFlash {
    0% { background: rgba(255,255,255,0.3); }
    100% { background: transparent; }
  }

  @keyframes bodyShake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }
  body.shake { animation: bodyShake 0.35s; }

  /* ============ Top overlay ============ */
  .top-overlay {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 20;
    padding-bottom: 40px;
    pointer-events: none;
  }
  .topbar, .score-chip {
    pointer-events: auto;
  }
  
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.4rem 0.4rem;
  }
  .game-title-wrap { display: flex; align-items: center; gap: 8px; }
  .game-title-wrap svg { width: 20px; height: 20px; color: #ffd23f; }
  .game-title {
    font-size: clamp(0.85rem, 2.4vw, 1.05rem);
    font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
    color: #ffffff;
  }
  .settings-btn {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15); color: #cfcfcf;
    cursor: pointer; transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .settings-btn:hover { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.35); }
  .settings-btn svg { width: 16px; height: 16px; }

  .settings-panel {
    position: fixed; top: 4.2rem; right: 1.4rem;
    width: min(240px, 80vw);
    background: rgba(10, 10, 10, 0.97);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 14px;
    padding: 14px; z-index: 40;
    opacity: 0; pointer-events: none; transform: translateY(-8px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .settings-panel.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .settings-panel h2 {
    font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255,255,255,0.5); margin-bottom: 10px; font-weight: 700;
  }
  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .settings-row span { font-size: 0.82rem; color: #eaeaea; }
  .settings-toggle {
    width: 36px; height: 20px; border-radius: 20px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    position: relative; cursor: pointer; transition: background .2s ease; flex-shrink: 0;
  }
  .settings-toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #cfcfcf; transition: transform .2s ease, background .2s ease;
  }
  .settings-toggle.on { background: rgba(255,255,255,0.3); border-color: #fff; }
  .settings-toggle.on::after { transform: translateX(16px); background: #fff; }

  /* ============ Score chip ============ */
  .score-chip {
    margin: 0.2rem 1.4rem 0;
    display: inline-flex; flex-direction: column; gap: 1px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 8px 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .hud-label {
    font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase;
    color: rgba(255,255,255,0.4); font-weight: 500;
  }
  .hud-value {
    font-size: clamp(1.15rem, 3.4vw, 1.5rem); font-weight: 700; color: #ffffff;
    font-variant-numeric: tabular-nums;
  }

  /* ============ Upgrade shop ============ */
  .upgrade-tab {
    position: fixed; top: 50%; right: 0; transform: translateY(-50%);
    width: 34px; height: 60px; border-radius: 10px 0 0 10px;
    background: #0f0f11; border: 1px solid rgba(255,255,255,0.1); border-right: none;
    color: #ffd23f; display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 50;
    transition: right .32s cubic-bezier(.2,.8,.2,1), bottom .32s cubic-bezier(.2,.8,.2,1), background .2s ease;
  }
  .upgrade-tab:hover { background: rgba(255,210,63,0.1); }
  .upgrade-tab.shifted { right: min(320px, 86vw); }
  .upgrade-tab svg { width: 18px; height: 18px; transition: transform .32s ease; }
  .upgrade-tab.shifted svg { transform: rotate(180deg); }

  .upgrade-panel {
    position: fixed; top: 50%; right: 0; 
    width: min(320px, 86vw);
    height: fit-content; max-height: 90vh;
    border-radius: 16px 0 0 16px;
    background: #0a0a0c;
    border: 1px solid rgba(255,255,255,0.08); border-right: none;
    display: flex; flex-direction: column;
    transform: translate(100%, -50%);
    transition: transform .32s cubic-bezier(.2,.8,.2,1);
    z-index: 45; overflow-y: auto;
  }
  .upgrade-panel.open { transform: translate(0, -50%); }

  .upgrade-header {
    padding: 1.4rem 1.3rem 1rem;
    padding-top: max(1.4rem, env(safe-area-inset-top));
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .upgrade-header h2 {
    font-size: 0.68rem; letter-spacing: 3px; text-transform: uppercase; color: #aaa; font-weight: 700;
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .upgrade-header h2 svg { width: 14px; height: 14px; color: #ffd23f; }
  .upgrade-panel-score-label {
    font-size: 0.55rem; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255,255,255,0.4); font-weight: 600;
  }
  .upgrade-panel-score {
    font-size: 1.6rem; font-weight: 700; color: #ffd23f;
    font-variant-numeric: tabular-nums;
  }

  .upgrade-list {
    padding: 1.2rem 1.1rem;
    padding-bottom: max(1.4rem, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
  }

  .upgrade-card {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    background: #121214; border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px; padding: 10px 10px 10px 14px;
    overflow: hidden;
  }
  .upgrade-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent);
  }
  .upgrade-card[data-key="speed"]      { --accent: #00f5c4; }
  .upgrade-card[data-key="dvds"]       { --accent: #7c6cf0; }
  .upgrade-card[data-key="multiplier"] { --accent: #ffd23f; }

  .upgrade-icon {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent); font-size: 1.1rem; font-weight: 800;
  }
  .upgrade-info { flex: 1; min-width: 0; }
  .upgrade-name { font-size: 0.85rem; font-weight: 700; color: #e0e0e0; display: flex; align-items: center; gap: 6px; }
  .upgrade-level {
    font-size: 0.55rem; color: var(--accent);
    letter-spacing: 0.5px; text-transform: uppercase; font-weight: 700;
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    padding: 2px 6px; border-radius: 6px;
  }
  .upgrade-desc { font-size: 0.65rem; color: #888; margin-top: 4px; }
  
  .upgrade-actions {
    display: flex; gap: 6px; align-items: stretch; flex-shrink: 0;
  }

  .devolve-btn {
    width: 28px; border-radius: 8px;
    background: transparent; border: 1px solid rgba(255,255,255,0.08);
    color: #666; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s ease;
  }
  .devolve-btn:hover:not(:disabled) { 
    background: rgba(255,60,60,0.1); border-color: rgba(255,60,60,0.3); color: #ff5555; 
  }
  .devolve-btn:disabled { opacity: 0.2; cursor: not-allowed; }
  .devolve-btn svg { width: 14px; height: 14px; }

  .upgrade-buy {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    color: var(--accent); min-width: 50px;
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font-family: inherit;
    transition: background .15s ease, opacity .15s ease;
  }
  .upgrade-buy:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .upgrade-buy:disabled { opacity: 0.25; cursor: not-allowed; }
  .buy-label { font-size: 0.5rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }
  .buy-cost { font-size: 0.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ============ Bottom Menu specific to Mobile ============ */
  @media (max-width: 768px) {
    .upgrade-tab {
      top: auto; right: auto;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 60px; height: 34px;
      border-radius: 10px 10px 0 0;
      border: 1px solid rgba(255,255,255,0.1); border-bottom: none;
    }
    .upgrade-tab.shifted {
      bottom: 300px;
      right: auto;
    }
    .upgrade-tab svg { transform: rotate(90deg); }
    .upgrade-tab.shifted svg { transform: rotate(270deg); }
    
    .upgrade-panel {
      top: auto; bottom: 0; right: 0; left: 0;
      width: 100%; height: fit-content; max-height: 80vh;
      border-radius: 16px 16px 0 0;
      border-left: none; border-right: none; border-top: 1px solid rgba(255,255,255,0.08);
      transform: translateY(100%);
    }
    .upgrade-panel.open {
      transform: translateY(0);
    }
  }

  /* ============ Bottom game nav ============ */
  .game-nav {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px;
    background: rgba(10, 10, 10, 0.97);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.15); padding: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6); z-index: 30;
    border-radius: 50px;
  }
  .game-nav-btn {
    background: transparent; border: none; color: #cfcfcf;
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .2s ease, color .2s ease;
  }
  .game-nav-btn svg { width: 16px; height: 16px; }
  .game-nav-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .game-nav-btn.random-btn { color: #ffd23f; }
  .game-nav-btn.random-btn:hover { background: rgba(255,210,63,0.14); }

  @media (min-width: 992px) {
    .game-nav {
      opacity: 0; transform: translate(-50%, 150%);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      pointer-events: none;
    }
    .game-nav.desktop-visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  }

  @media (max-width: 991px) {
    .game-nav {
      left: auto; right: 16px; transform: none;
      width: 50px; height: 50px; padding: 0;
      background: transparent; border: none; box-shadow: none;
      backdrop-filter: none; -webkit-backdrop-filter: none;
      cursor: pointer;
    }
    .game-nav::before {
      content: ''; position: absolute; inset: 0; border-radius: 14px;
      background: rgba(10, 10, 10, 0.97);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' stroke='%23ffd23f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='3' y='3' width='18' height='18' rx='4'%3E%3C/rect%3E%3Ccircle cx='8' cy='8' r='1.3' fill='%23ffd23f' stroke='none'%3E%3C/circle%3E%3Ccircle cx='16' cy='8' r='1.3' fill='%23ffd23f' stroke='none'%3E%3C/circle%3E%3Ccircle cx='12' cy='12' r='1.3' fill='%23ffd23f' stroke='none'%3E%3C/circle%3E%3Ccircle cx='8' cy='16' r='1.3' fill='%23ffd23f' stroke='none'%3E%3C/circle%3E%3Ccircle cx='16' cy='16' r='1.3' fill='%23ffd23f' stroke='none'%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: center; background-size: 20px 20px;
      transition: opacity 0.25s ease;
    }
    .game-nav.mobile-expanded::before { opacity: 0; }
    .game-nav-btn {
      position: absolute; right: 0; bottom: 56px;
      width: 46px; height: 46px; border-radius: 14px;
      background: rgba(10, 10, 10, 0.97);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      opacity: 0; transform: translateY(14px) scale(0.85); pointer-events: none;
      transition: opacity 0.25s ease, transform 0.32s cubic-bezier(0.2,0.8,0.2,1);
    }
    .game-nav-btn:nth-child(1) { bottom: 56px; transition-delay: 0s; }
    .game-nav-btn:nth-child(2) { bottom: 112px; transition-delay: 0.04s; }
    .game-nav-btn:nth-child(3) { bottom: 168px; transition-delay: 0.08s; }
    .game-nav.mobile-expanded .game-nav-btn { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  }

/* Robust mobile game navigation: always tappable, no hidden/expanded state. */
@media (max-width: 991px) {
  .game-nav {
    left: 50% !important;
    right: auto !important;
    bottom: max(10px, env(safe-area-inset-bottom)) !important;
    top: auto !important;
    transform: translateX(-50%) !important;
    width: auto !important;
    height: auto !important;
    min-width: 0 !important;
    padding: 5px !important;
    display: flex !important;
    align-items: center !important;
    gap: 3px !important;
    border-radius: 18px !important;
    background: rgba(10,10,12,.96) !important;
    backdrop-filter: blur(18px) !important;
    -webkit-backdrop-filter: blur(18px) !important;
    border: 1px solid rgba(255,255,255,.14) !important;
    box-shadow: 0 14px 38px rgba(0,0,0,.55) !important;
    z-index: 90 !important;
  }
  .game-nav::before { display: none !important; content: none !important; }
  .game-nav-btn,
  .game-nav.mobile-expanded .game-nav-btn {
    position: static !important;
    right: auto !important;
    bottom: auto !important;
    width: 42px !important;
    height: 42px !important;
    min-width: 42px !important;
    border-radius: 13px !important;
    opacity: 1 !important;
    transform: none !important;
    pointer-events: auto !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    text-decoration: none !important;
    -webkit-tap-highlight-color: transparent;
  }
  .game-nav-btn svg { pointer-events: none; }
}
</style>
</head>
<body data-game-index="4">

  <div class="dvd-stage" id="dvd-stage">
    <div class="dvd-logo" id="dvd-logo">
      <svg viewBox="0 0 200 112" xmlns="http://www.w3.org/2000/svg">
        <text x="100" y="65" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="56" fill="currentColor" letter-spacing="1">DVD</text>
        <g transform="translate(100,88)">
          <ellipse rx="75" ry="16" fill="currentColor"></ellipse>
          <ellipse rx="25" ry="5.5" fill="#000"></ellipse>
        </g>
      </svg>
    </div>
  </div>
  <div class="corner-flash" id="corner-flash">
    <span class="corner-flash-text">CORNER! +100</span>
  </div>

  <div class="top-overlay">
    <div class="topbar">
      <div class="game-title-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="12" cy="12" r="2.5" fill="currentColor"></circle>
        </svg>
        <span class="game-title">DVD Game</span>
      </div>
      <button id="settings-btn" class="settings-btn" aria-label="Settings" aria-haspopup="true" aria-expanded="false" type="button">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="5" r="1.6" fill="currentColor"></circle>
          <circle cx="12" cy="12" r="1.6" fill="currentColor"></circle>
          <circle cx="12" cy="19" r="1.6" fill="currentColor"></circle>
        </svg>
      </button>
    </div>
    <div class="score-chip">
      <span class="hud-label">Score</span>
      <span class="hud-value" id="score">0</span>
    </div>
  </div>

  <div class="settings-panel" id="settings-panel" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <div class="settings-row">
      <span>Sound</span>
      <button class="settings-toggle" id="sound-toggle" role="switch" aria-checked="true" type="button"></button>
    </div>
  </div>

  <button class="upgrade-tab" id="upgrade-tab" aria-label="Upgrades" type="button">
    <svg id="upgrade-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"></path>
    </svg>
  </button>

  <aside class="upgrade-panel" id="upgrade-panel">
    <div class="upgrade-header">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"></path>
        </svg>
        Upgrades
      </h2>
      <div class="upgrade-panel-score-label">DVD Points</div>
      <div class="upgrade-panel-score" id="panel-score">0</div>
    </div>

    <div class="upgrade-list">
      <div class="upgrade-card" data-key="speed">
        <div class="upgrade-icon">⚡</div>
        <div class="upgrade-info">
          <div class="upgrade-name">Speed <span class="upgrade-level lvl">0</span></div>
          <div class="upgrade-desc"></div>
        </div>
        <div class="upgrade-actions">
          <button class="devolve-btn" type="button" title="Refund Level">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button class="upgrade-buy" type="button">
            <span class="buy-label">Buy</span>
            <span class="buy-cost">15</span>
          </button>
        </div>
      </div>

      <div class="upgrade-card" data-key="dvds">
        <div class="upgrade-icon">💿</div>
        <div class="upgrade-info">
          <div class="upgrade-name">+1 DVD <span class="upgrade-level lvl">0</span></div>
          <div class="upgrade-desc"></div>
        </div>
        <div class="upgrade-actions">
          <button class="devolve-btn" type="button" title="Refund Level">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button class="upgrade-buy" type="button">
            <span class="buy-label">Buy</span>
            <span class="buy-cost">50</span>
          </button>
        </div>
      </div>

      <div class="upgrade-card" data-key="multiplier">
        <div class="upgrade-icon">×</div>
        <div class="upgrade-info">
          <div class="upgrade-name">Score <span class="upgrade-level lvl">0</span></div>
          <div class="upgrade-desc"></div>
        </div>
        <div class="upgrade-actions">
          <button class="devolve-btn" type="button" title="Refund Level">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button class="upgrade-buy" type="button">
            <span class="buy-label">Buy</span>
            <span class="buy-cost">30</span>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <nav class="game-nav" id="game-nav" aria-label="Game navigation" tabindex="0">
    <a class="game-nav-btn" href="game4.html" aria-label="Previous game">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16.5 5 7.5 12l9 7Z"></path>
      </svg>
    </a>
    <button class="game-nav-btn random-btn" id="random-game-btn" aria-label="Random game" type="button"
      onclick="(function(){var g=['game1.html','game2.html','game3.html','game4.html','game5.html'];var cur=location.pathname.split('/').pop();var a=g.filter(function(x){return x!==cur;});location.assign(a[Math.floor(Math.random()*a.length)]);})()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
        <circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="8" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="8" cy="16" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="16" r="1.3" fill="currentColor" stroke="none"></circle>
      </svg>
    </button>
    <a class="game-nav-btn" href="game1.html" aria-label="Next game">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.5 5l9 7-9 7Z"></path>
      </svg>

<script src="shared.js?v=20260920c"></script>
<script>
  // ===========================================================
  // DVD bounce physics 
  // ===========================================================
  const stageEl = document.getElementById('dvd-stage');
  const scoreEl = document.getElementById('score');
  const panelScoreEl = document.getElementById('panel-score');
  const cornerFlashEl = document.getElementById('corner-flash');
  const baseLogoEl = document.getElementById('dvd-logo');
  const logoInnerHTML = baseLogoEl.innerHTML;
  baseLogoEl.removeAttribute('id');

  const COLORS = ['#00f5c4', '#ff3d6e', '#ffd23f', '#7c6cf0', '#00c2ff', '#ff8a3d', '#39ff88', '#ff5ec4', '#ffffff'];

  let balls = []; 
  let logoW = 0, logoH = 0, stageW = 0, stageH = 0;
  let score = 0, corners = 0;
  let lastTime = 0;
  let fairnessScale = 1;

  const upgrades = {
    speed:      { level: 0, baseCost: 15,  growth: 1.15 },
    dvds:       { level: 0, baseCost: 50,  growth: 1.3, max: 7 }, 
    multiplier: { level: 0, baseCost: 30,  growth: 1.25 }
  };

  function upgradeCost(key, levelOffset = 0) {
    const u = upgrades[key];
    return Math.floor(u.baseCost * Math.pow(u.growth, u.level + levelOffset));
  }
  function speedMultiplier() { return 1 + upgrades.speed.level * 0.15; }
  function pointMultiplier() { return 1 + upgrades.multiplier.level * 0.5; }

  function measure() {
    stageW = stageEl.clientWidth;
    stageH = stageEl.clientHeight;
    logoW = baseLogoEl.offsetWidth;
    logoH = baseLogoEl.offsetHeight;

    /* Small screens have a much shorter travel path to the walls. Slow the
       whole simulation proportionally so corner-hit opportunities stay fair. */
    const travelW = Math.max(stageW - logoW, 1);
    const travelH = Math.max(stageH - logoH, 1);
    const referenceTravelW = 1216;
    const referenceTravelH = 684;
    const referenceCollisionRate = (1 / referenceTravelW) + (1 / referenceTravelH);
    const currentCollisionRate = (1 / travelW) + (1 / travelH);
    fairnessScale = Math.max(0.35, Math.min(1, referenceCollisionRate / currentCollisionRate));
  }

  function pickNewColor(ball) {
    let idx;
    do { idx = Math.floor(Math.random() * COLORS.length); } while (idx === ball.colorIdx && COLORS.length > 1);
    ball.colorIdx = idx;
    ball.el.style.color = COLORS[idx];
  }

  function createBallElement() {
    const el = document.createElement('div');
    el.className = 'dvd-logo';
    el.innerHTML = logoInnerHTML;
    stageEl.appendChild(el);
    return el;
  }

  function resetBallPosition(ball) {
    ball.x = Math.random() * Math.max(stageW - logoW, 0);
    ball.y = Math.random() * Math.max(stageH - logoH, 0);
    const angle = (20 + Math.random() * 50) * (Math.PI / 180); 
    const speed = 230 * speedMultiplier();
    ball.vx = (Math.random() < 0.5 ? -1 : 1) * speed * Math.cos(angle);
    ball.vy = (Math.random() < 0.5 ? -1 : 1) * speed * Math.sin(angle);
    pickNewColor(ball);
    ball.el.style.transform = 'translate(' + ball.x + 'px, ' + ball.y + 'px)';
  }

  function spawnBall(el) {
    const ball = { el, x: 0, y: 0, vx: 0, vy: 0, colorIdx: -1 };
    resetBallPosition(ball);
    balls.push(ball);
  }

  function triggerCornerEffects() {
    cornerFlashEl.classList.remove('flash-anim');
    void cornerFlashEl.offsetWidth;
    cornerFlashEl.classList.add('flash-anim');

    document.body.classList.remove('shake');
    void document.body.offsetWidth;
    document.body.classList.add('shake');
  }

  function updateScore() {
    scoreEl.innerText = score;
    panelScoreEl.innerText = score;
    renderUpgradePanel();
  }

  function tick(now) {
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 1000;
    dt = Math.min(dt, 0.05) * fairnessScale; 
    lastTime = now;

    balls.forEach(ball => {
      let nx = ball.x + ball.vx * dt;
      let ny = ball.y + ball.vy * dt;
      let hitX = false, hitY = false;

      if (nx <= 0) { nx = 0; ball.vx = -ball.vx; hitX = true; }
      else if (nx + logoW >= stageW) { nx = stageW - logoW; ball.vx = -ball.vx; hitX = true; }

      if (ny <= 0) { ny = 0; ball.vy = -ball.vy; hitY = true; }
      else if (ny + logoH >= stageH) { ny = stageH - logoH; ball.vy = -ball.vy; hitY = true; }

      ball.x = nx; ball.y = ny;

      if (hitX && hitY) {
        corners++;
        score += Math.round(100 * pointMultiplier());
        updateScore();
        pickNewColor(ball);
        triggerCornerEffects();
      } else if (hitX || hitY) {
        score += Math.round(1 * pointMultiplier());
        updateScore();
        pickNewColor(ball);
      }

      ball.el.style.transform = 'translate(' + ball.x + 'px, ' + ball.y + 'px)';
    });

    requestAnimationFrame(tick);
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      measure();
      balls.forEach(ball => {
        ball.x = Math.min(ball.x, Math.max(stageW - logoW, 0));
        ball.y = Math.min(ball.y, Math.max(stageH - logoH, 0));
        ball.el.style.transform = 'translate(' + ball.x + 'px, ' + ball.y + 'px)';
      });
      if (window.innerWidth <= 768 && upgradePanel.classList.contains('open')) {
        upgradeTab.style.bottom = `${upgradePanel.offsetHeight}px`;
      } else {
        upgradeTab.style.bottom = '';
      }
    }, 120);
  });

  // ---- Upgrade shop ----
  function buyUpgrade(key) {
    const u = upgrades[key];
    if (key === 'dvds' && u.level >= u.max) return;

    const cost = upgradeCost(key);
    if (score < cost) return;
    score -= cost;

    if (key === 'speed') {
      const oldMult = speedMultiplier();
      u.level++;
      const ratio = speedMultiplier() / oldMult;
      balls.forEach(b => { b.vx *= ratio; b.vy *= ratio; });
    } else if (key === 'dvds') {
      u.level++;
      spawnBall(createBallElement());
    } else {
      u.level++;
    }
    updateScore();
  }

  function devolveUpgrade(key) {
    const u = upgrades[key];
    if (u.level <= 0) return;

    // Refund exactly half of what the PREVIOUS level cost
    const lastCost = upgradeCost(key, -1);
    score += Math.floor(lastCost / 2);

    if (key === 'speed') {
      const oldMult = speedMultiplier();
      u.level--;
      const ratio = speedMultiplier() / oldMult;
      balls.forEach(b => { b.vx *= ratio; b.vy *= ratio; });
    } else if (key === 'dvds') {
      u.level--;
      const removedBall = balls.pop();
      if (removedBall && removedBall.el && removedBall.el.parentNode) {
        removedBall.el.parentNode.removeChild(removedBall.el);
      }
    } else {
      u.level--;
    }
    updateScore();
  }

  function renderUpgradePanel() {
    // Simplified descriptions for a cleaner UI
    document.querySelector('.upgrade-card[data-key="speed"] .upgrade-desc').innerText =
      '+' + Math.round((speedMultiplier() - 1) * 100) + '% velocity';
    document.querySelector('.upgrade-card[data-key="dvds"] .upgrade-desc').innerText =
      balls.length + ' / ' + (1 + upgrades.dvds.max) + ' active';
    document.querySelector('.upgrade-card[data-key="multiplier"] .upgrade-desc').innerText =
      '×' + pointMultiplier().toFixed(1) + ' per hit';

    Object.keys(upgrades).forEach(key => {
      const card = document.querySelector('.upgrade-card[data-key="' + key + '"]');
      const u = upgrades[key];
      
      card.querySelector('.lvl').innerText = `Lvl ${u.level}`;
      
      const costEl = card.querySelector('.buy-cost');
      const buyBtn = card.querySelector('.upgrade-buy');
      const devolveBtn = card.querySelector('.devolve-btn');

      devolveBtn.disabled = u.level === 0;

      if (key === 'dvds' && u.level >= u.max) {
        costEl.innerText = 'MAX';
        buyBtn.disabled = true;
        return;
      }

      const cost = upgradeCost(key);
      costEl.innerText = cost;
      buyBtn.disabled = score < cost;
    });
  }

  document.querySelectorAll('.upgrade-card').forEach(card => {
    const key = card.dataset.key;
    card.querySelector('.upgrade-buy').addEventListener('click', () => buyUpgrade(key));
    card.querySelector('.devolve-btn').addEventListener('click', () => devolveUpgrade(key));
  });

  const upgradeTab = document.getElementById('upgrade-tab');
  const upgradePanel = document.getElementById('upgrade-panel');
  
  upgradeTab.addEventListener('click', () => {
    const open = upgradePanel.classList.toggle('open');
    upgradeTab.classList.toggle('shifted', open);
    
    // Auto-adjust bottom spacing for mobile tab based on exact panel height
    if (window.innerWidth <= 768) {
      if (open) {
        upgradeTab.style.bottom = `${upgradePanel.offsetHeight}px`;
      } else {
        upgradeTab.style.bottom = '0px';
      }
    }
  });


  window.onload = () => {
    measure();
    spawnBall(baseLogoEl);
    renderUpgradePanel();
    requestAnimationFrame(tick);
  };

  // ===========================================================
</script>
</body>
