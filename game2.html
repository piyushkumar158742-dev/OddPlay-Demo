<style>
:root {
  --bg: #05070a;
  --surface: rgba(17,19,25,0.65);
  --surface-hover: rgba(24,27,35,0.9);
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.25);
  --text: #eef1f6;
  --emerald: #34d97a;
  --font-display: 'Outfit', sans-serif;
  --font-mono: 'Space Grotesk', sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-display);
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 10% 15%, rgba(52,217,122,0.05) 0%, transparent 40%),
    radial-gradient(circle at 90% 85%, rgba(91,140,255,0.05) 0%, transparent 40%),
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
  background-attachment: fixed;
  color: var(--text);
  overflow-x: hidden;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb { background: #2a2d35; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3c4050; }

.price-font { font-family: var(--font-mono); }
.gradient-text {
  background: linear-gradient(135deg, #34d97a 0%, #5b8cff 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.delta-toast {
  position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-mono); font-weight: 700; font-size: 0.9rem;
  pointer-events: none; animation: floatUp 0.8s ease-out forwards; white-space: nowrap; text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}
.delta-pos { color: var(--emerald); }
.delta-neg { color: #ff6767; }
@keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -24px); } }

/* Cards & Grid */
.item-card {
  background: var(--surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; position: relative; overflow: hidden;
}
.item-card:hover {
  border-color: var(--border-hover); transform: translateY(-4px);
  box-shadow: 0 14px 32px rgba(0,0,0,0.6); background: var(--surface-hover);
}

.icon-slot {
  width: 76px; height: 76px; margin: 6px auto 14px auto; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  background: #0a0a0c; border: 1px solid #1e1e22; position: relative; user-select: none;
  transition: all 0.3s ease; perspective: 400px;
}
@media(min-width:640px) { .icon-slot { width: 84px; height: 84px; } }

.pixel-canvas {
  width: 56px; height: 56px; image-rendering: pixelated;
  filter: drop-shadow(0 6px 8px rgba(0,0,0,0.8)); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@media(min-width:640px) { .pixel-canvas { width: 62px; height: 62px; } }
.item-card:hover .pixel-canvas { transform: scale(1.15) rotate(3deg); }
.item-card:hover .iso-canvas { transform: scale(1.15) rotateY(10deg); }

.rarity-badge {
  position: absolute; top: 8px; left: 8px; font-family: 'Press Start 2P', monospace; font-size: 6px;
  padding: 4px 6px; border-radius: 5px; z-index: 2; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.12);
}
.rarity-common .rarity-badge { color: #9aa1ad; } .rarity-common .icon-slot { box-shadow: inset 0 0 15px rgba(255,255,255,0.03); border-color: #242429; }
.rarity-uncommon .rarity-badge { color: #34d97a; } .rarity-uncommon .icon-slot { box-shadow: inset 0 0 18px rgba(52,217,122,0.12); border-color: rgba(52,217,122,0.28); }
.rarity-rare .rarity-badge { color: #5b8cff; } .rarity-rare .icon-slot { box-shadow: inset 0 0 18px rgba(91,140,255,0.16); border-color: rgba(91,140,255,0.35); }
.rarity-epic .rarity-badge { color: #b18cfb; } .rarity-epic .icon-slot { box-shadow: inset 0 0 22px rgba(177,140,251,0.2); border-color: rgba(177,140,251,0.45); }
.rarity-legendary .rarity-badge { color: #f6b93b; } .rarity-legendary .icon-slot { box-shadow: inset 0 0 26px rgba(246,185,59,0.24); border-color: rgba(246,185,59,0.55); }

.icon-slot::before {
  content: ''; position: absolute; inset: -8px; border-radius: 18px; z-index: -1;
  background: radial-gradient(circle, var(--glow, transparent) 0%, transparent 72%);
  filter: blur(7px); opacity: 0.75;
}
.rarity-uncommon .icon-slot { --glow: rgba(52,217,122,0.4); }
.rarity-rare .icon-slot { --glow: rgba(91,140,255,0.45); }
.rarity-epic .icon-slot { --glow: rgba(177,140,251,0.5); }
.rarity-legendary .icon-slot { --glow: rgba(246,185,59,0.55); }

/* Strict Input Styling */
input[type="text"] {
  background: transparent; color: white; border: none; text-align: center;
  font-family: var(--font-mono); font-weight: 700; width: 100%; min-width: 0;
  outline: none; box-shadow: none; padding: 0; margin: 0;
}
input[type="text"]::placeholder { color: #4b5563; }

@media (max-width: 449px) {
  .item-card input[type="text"] { flex: 0 1 auto !important; width: 24px !important; max-width: 24px !important; margin: 0 !important; }
}

function shade(col, amt) {
  let useHash = col.startsWith('#');
  col = col.replace(/^#/, '');
  if(col.length === 3) col = col[0]+col[0]+col[1]+col[1]+col[2]+col[2];
  let num = parseInt(col,16);
  let r = (num >> 16) + amt, b = ((num >> 8) & 0x00FF) + amt, g = (num & 0x0000FF) + amt;
  r = r<255?r<0?0:r:255; b = b<255?b<0?0:b:255; g = g<255?g<0?0:g:255;
  let newColor = (g | (b << 8) | (r << 16)).toString(16);
  while(newColor.length<6) newColor = "0"+newColor;
  return (useHash?"#":"") + newColor;
}

function drawIsoCube(ctx, baseColor, sizeMultiplier = 1) {
  const cx = 32 * sizeMultiplier;
  const cy = 34 * sizeMultiplier; 
  const a = 18 * sizeMultiplier;
  const b = 15.5 * sizeMultiplier;

  const pTop = {x: cx, y: cy - a};
  const pBot = {x: cx, y: cy + a};
  const pCen = {x: cx, y: cy};
  const pTL = {x: cx - b, y: cy - a/2};
  const pTR = {x: cx + b, y: cy - a/2};
  const pBL = {x: cx - b, y: cy + a/2};
  const pBR = {x: cx + b, y: cy + a/2};

  const topC = shade(baseColor, 40);
  const rightC = shade(baseColor, 0);
  const leftC = shade(baseColor, -40);
  
  ctx.lineWidth = 2.5 * sizeMultiplier;
  ctx.strokeStyle = '#111';
  ctx.lineJoin = 'round';

  ctx.fillStyle = topC;
  ctx.beginPath(); ctx.moveTo(pCen.x, pCen.y); ctx.lineTo(pTR.x, pTR.y); ctx.lineTo(pTop.x, pTop.y); ctx.lineTo(pTL.x, pTL.y); ctx.closePath(); ctx.fill(); ctx.stroke();
  
  ctx.fillStyle = leftC;
  ctx.beginPath(); ctx.moveTo(pCen.x, pCen.y); ctx.lineTo(pTL.x, pTL.y); ctx.lineTo(pBL.x, pBL.y); ctx.lineTo(pBot.x, pBot.y); ctx.closePath(); ctx.fill(); ctx.stroke();
  
  ctx.fillStyle = rightC;
  ctx.beginPath(); ctx.moveTo(pCen.x, pCen.y); ctx.lineTo(pBot.x, pBot.y); ctx.lineTo(pBR.x, pBR.y); ctx.lineTo(pTR.x, pTR.y); ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawItemSprite(ctx, templateKey, colors, sizeMultiplier = 1) {
  const data = sprites[templateKey];
  if(!data) return;
  const rows = data.split(',');
  const scale = 3.6 * sizeMultiplier;
  const offset = 3.2 * sizeMultiplier; 
  for(let y=0; y<16; y++) {
    for(let x=0; x<16; x++) {
      const char = rows[y][x];
      if(char !== '0') {
        ctx.fillStyle = colors[parseInt(char)];
        ctx.fillRect(offset + x*scale, offset + y*scale, scale, scale);
      }
    }
  }
}

function formatMoney(amount) {
  return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(amount);
}

function formatShorthand(num) {
  if (num === 0) return "$0.00";
  if (num >= 1e12) return '$' + (num/1e12).toFixed(1).replace(/\.0$/,'') + 'T';
  if (num >= 1e9) return '$' + (num/1e9).toFixed(1).replace(/\.0$/,'') + 'B';
  if (num >= 1e6) return '$' + (num/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  if (num >= 1e3) return '$' + (num/1e3).toFixed(num%1000===0?0:1).replace(/\.0$/,'') + 'K';
  if (num > 0 && num < 1) return '$' + num.toFixed(2);
  if (num % 1 !== 0) return '$' + num.toFixed(2);
  return '$' + num;
}

function spawnDeltaToast(delta) {
  if(!delta) return;
  const wrap = document.getElementById('ticker-wrap');
  const el = document.createElement('span');
  el.className = 'delta-toast ' + (delta>0?'delta-pos':'delta-neg');
  el.textContent = (delta>0?'+':'-') + formatShorthand(Math.abs(delta));
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 800);
}

function calculateTotal() {
  let newTotal = 0;
  inventory.forEach(item => { newTotal += item.price * (quantities[item.id] || 0); });
  const delta = newTotal - totalSpent;
  totalSpent = newTotal;
  
  document.getElementById('total-spent').textContent = totalSpent === 0 ? '$0.00' : formatShorthand(totalSpent);
  
  spawnDeltaToast(delta);
  if(!document.getElementById('receipt-modal').classList.contains('hidden')) buildReceipt();
}

function updateQty(id, change) {
  let current = quantities[id] || 0;
  current += change;
  if(current < 0) current = 0;
  if(current > 9999999) current = 9999999;
  quantities[id] = current;
  const inputEl = document.getElementById(`input-${id}`);
  if(inputEl) {
    inputEl.value = current === 0 ? '' : current;
    inputEl.style.transform = 'scale(1.15)';
    setTimeout(()=>inputEl.style.transform='scale(1)', 150);
  }
  calculateTotal();
}

function validateInput(el, id) {
  let val = el.value.replace(/\D/g, ''); 
  if (val.length > 7) val = val.slice(0, 7); 
  el.value = val;
  let num = parseInt(val, 10);
  if (isNaN(num)) num = 0;
  quantities[id] = num;
  calculateTotal();
}

function handleBlur(el) {
  if (el.value === '' || el.value === '0') el.value = ''; 
}

function captureReceiptPages(printWrapper) {
  return html2canvas(printWrapper, { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 }).then(canvas => {
    const pageWidthIn = 4;
    const dpi = canvas.width / pageWidthIn;
    const maxPageHeightPx = Math.floor(9 * dpi);
    const pages = [];
    let renderedY = 0;

    while (renderedY < canvas.height) {
      const sliceHeight = Math.min(maxPageHeightPx, canvas.height - renderedY);
      const pageCanvas = document.createElement('canvas');
      pageCanvas.width = canvas.width;
      pageCanvas.height = sliceHeight;
      const ctx = pageCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
      ctx.drawImage(canvas, 0, renderedY, canvas.width, sliceHeight, 0, 0, canvas.width, sliceHeight);
      pages.push({
        dataURL: pageCanvas.toDataURL('image/png', 1.0),
        widthIn: pageWidthIn,
        heightIn: sliceHeight / dpi
      });
      renderedY += sliceHeight;
    }
    return pages;
  });
}

function dataURLtoFile(dataUrl, filename) {
  const arr = dataUrl.split(',');
  const mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while (n--) u8arr[n] = bstr.charCodeAt(n);
  return new File([u8arr], filename, { type: mime });
}

function downloadPDF() {
  const jsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  if (!jsPDF) { alert('PDF library did not load. Please refresh and try again.'); return; }

  const now = new Date();
  const dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
  const receiptId = 'BM-' + Math.floor(Math.random() * 1000000000).toString().padStart(9, '0');

  const pageW = 4, pageH = 9, marginX = 0.3, marginBottom = 0.5, iconSize = 0.18;
  let y = 0.5;
  const pdf = new jsPDF({ unit: 'in', format: [pageW, pageH] });

  function checkPageBreak(nextBlockHeight) {
    if (y + nextBlockHeight > pageH - marginBottom) {
      pdf.addPage([pageW, pageH]);
      y = 0.5;
    }
  }
  function dashedLine(yy) {
    pdf.setDrawColor(190); pdf.setLineWidth(0.005);
    pdf.setLineDashPattern([0.02, 0.02], 0);
    pdf.line(marginX, yy, pageW - marginX, yy);
    pdf.setLineDashPattern([], 0);
  }

  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(18); pdf.setTextColor(20);
  pdf.text('BLOCK MARKET', pageW / 2, y, { align: 'center' });
  y += 0.18;
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5); pdf.setTextColor(130);
  pdf.text('VOXEL EXCHANGE CO.', pageW / 2, y, { align: 'center' });
  y += 0.15;
  dashedLine(y);
  y += 0.2;

  pdf.setFontSize(8); pdf.setTextColor(60);
    [['Date', dateStr], ['Receipt #', receiptId], ['Region', userRegion]].forEach(([k, v]) => {
    pdf.text(k, marginX, y); pdf.text(v, pageW - marginX, y, { align: 'right' });
    y += 0.15;
  });
  dashedLine(y);
  y += 0.18;

    pdf.setFontSize(7); pdf.setTextColor(150);
  pdf.text('ITEM', marginX, y); pdf.text('TOTAL', pageW - marginX, y, { align: 'right' });
  y += 0.24;

  let totalQty = 0;
  inventory.forEach(item => {
    const qty = quantities[item.id];
    if (qty > 0) {
      totalQty += qty;
      checkPageBreak(0.34);
      const iconCanvas = document.getElementById(`rcpt-${item.id}`);
      if (iconCanvas) {
        try { pdf.addImage(iconCanvas.toDataURL('image/png'), 'PNG', marginX, y - 0.14, iconSize, iconSize); } catch (e) {}
      }
      const textX = marginX + iconSize + 0.08;
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9.5); pdf.setTextColor(20);
      pdf.text(item.name, textX, y);
      pdf.text(formatShorthand(item.price * qty), pageW - marginX, y, { align: 'right' });
      y += 0.14;
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7); pdf.setTextColor(150);
      pdf.text(`${qty} x ${formatShorthand(item.price)}`, textX, y);
      y += 0.16;
      pdf.setDrawColor(190); pdf.setLineWidth(0.012);
      pdf.line(marginX, y, pageW - marginX, y);
      y += 0.18;
    }
  });

  checkPageBreak(0.5);
  y += 0.04;
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8); pdf.setTextColor(100);
  pdf.text('Items (qty)', marginX, y);
  pdf.text(String(totalQty), pageW - marginX, y, { align: 'right' });
  y += 0.15;
  pdf.setDrawColor(20); pdf.setLineWidth(0.02);
  pdf.line(marginX, y, pageW - marginX, y);
  y += 0.22;

  const totalDueNumber = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 }).format(totalSpent);
  const finalTotal = totalSpent % 1 === 0 ? totalDueNumber.replace('.00', '') : totalDueNumber;

  checkPageBreak(0.3);
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11); pdf.setTextColor(20);
  pdf.text('TOTAL', marginX, y);
  pdf.setFontSize(16);
  pdf.text(finalTotal, pageW - marginX, y, { align: 'right' });
  y += 0.25;

  checkPageBreak(0.5);
  dashedLine(y);
  y += 0.2;
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9); pdf.setTextColor(70);
  pdf.text('Thank you for shopping!', pageW / 2, y, { align: 'center' });
  y += 0.13;
  pdf.setFontSize(6.5); pdf.setTextColor(150);
  pdf.text('All sales are final. No refunds on blocks or items.', pageW / 2, y, { align: 'center' });

  pdf.save('BlockMarket_Receipt.pdf');
}
