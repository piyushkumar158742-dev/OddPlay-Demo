<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060d">
<title>OddPlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#05060d;--panel:rgba(14,15,28,.84);--text:#f7f7fb;--accent:#8979ff;--accent2:#aaa0ff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--text);font-family:"DM Sans",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(137,121,255,.12),transparent 28%),radial-gradient(circle at 18% 20%,rgba(255,255,255,.018),transparent 20%),radial-gradient(circle at 82% 82%,rgba(255,255,255,.018),transparent 20%);filter:blur(9px)}
.loader{position:relative;width:min(88vw,400px);padding:32px;border:1px solid rgba(255,255,255,.075);border-radius:22px;background:var(--panel);box-shadow:0 28px 80px rgba(0,0,0,.44),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:30px}
.mark{position:relative;width:16px;height:16px;flex:0 0 16px;border-radius:5px;background:linear-gradient(135deg,var(--accent2),var(--accent));transform:rotate(12deg);box-shadow:0 0 24px rgba(137,121,255,.28)}
.mark::after{content:"";position:absolute;width:5px;height:5px;left:5.5px;top:5.5px;border-radius:1.5px;background:#fff;opacity:.85}
.logo{margin:0;font:700 clamp(2.3rem,9vw,3.2rem)/1 "Space Mono",monospace;letter-spacing:-.055em}
.tagline{margin:0 0 30px;color:#777887;font-size:.78rem}
.status{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.label{margin:0;color:#bdbdc8;font-size:.76rem;font-weight:500}
.percent{margin:0;color:#666777;font:400 .65rem/1 "Space Mono",monospace;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.track{height:5px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.065);box-shadow:inset 0 1px 1px rgba(0,0,0,.22)}
.bar{display:block;width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 18px rgba(137,121,255,.32);transform:scaleX(0);transform-origin:left center;transition:transform .06s linear}
@media(max-width:480px){.loader{width:min(90vw,400px);padding:28px 24px;border-radius:19px}.brand{margin-bottom:27px}.tagline{margin-bottom:27px}.logo{font-size:2.3rem}}
@media(prefers-reduced-motion:reduce){.bar{transition:none;transform:scaleX(1)}}
</style>
    <link rel="icon" type="image/png" href="favicon.png?v=20260921">
</head>
<body>
<main class="loader" aria-live="polite" aria-busy="true">
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1 class="logo">OddPlay</h1></div>
  <p class="tagline">A small arcade of very odd ideas.</p>
  <div class="status">
    <p class="label" id="status">Preparing your game</p>
    <p class="percent" id="percent">00%</p>
  </div>
  <div class="track" aria-hidden="true"><span class="bar" id="bar"></span></div>
</main>
<script>
(function(){
  var status=document.getElementById('status');
  var percent=document.getElementById('percent');
  var bar=document.getElementById('bar');
  var games=[
    {name:'Cosmic Calendar',url:'game1.html'},
    {name:'Block Market',url:'game2.html'},
    {name:'Stop at 5.000',url:'game3.html'},
    {name:'A is Z Typer',url:'game4.html'},
    {name:'DVD Game',url:'game5.html'}
  ];

  var started=performance.now();
  var minimum=1590+Math.floor(Math.random()*1331);
  var launched=false;
  var selected=games[Math.floor(Math.random()*games.length)];
  var fallbackTimer;

  function update(){
    if(launched)return;
    var elapsed=performance.now()-started;
    var progress=Math.min(.96,elapsed/minimum);
    var value=Math.min(96,Math.floor(progress*96));
    percent.textContent=(value<10?'0':'')+value+'%';
    bar.style.transform='scaleX('+progress+')';
    if(elapsed<minimum) requestAnimationFrame(update);
  }

  function launch(game){
    if(launched)return;
    launched=true;
    clearTimeout(fallbackTimer);
    status.textContent='Opening '+game.name;
    percent.textContent='100%';
    bar.style.transform='scaleX(1)';
    setTimeout(function(){window.location.replace(game.url);},80);
  }

  requestAnimationFrame(update);

  fetch('games.json',{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('registry');return r.json();})
    .then(function(data){
      if(Array.isArray(data)){
        var live=data.filter(function(g){return g&&typeof g.url==='string'&&g.url.trim();});
        if(live.length)selected=live[Math.floor(Math.random()*live.length)];
      }
    })
    .catch(function(){});

  fallbackTimer=setTimeout(function(){launch(selected);},minimum);
})();
</script>
</body>
</html>
